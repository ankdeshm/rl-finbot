# Golden questions for the evaluation (tests/run_eval.py).
#
# Expected values are NOT hard-coded: each `expect` item is a small spec that tests/eval_dsl.py
# compiles to raw SQL over the base tables (independent of the semantic layer). As-of date is
# 2026-11-12, so "this year" / "YTD" = Jan-Oct 2026 and "last month" = Oct 2026.
#
# Fields:
#   id, category, q (last turn), turns (optional earlier turns of the same conversation),
#   persona (default group_cfo), tools (accepted primary tools), status (default ok),
#   expect: list of DSL specs; the first one is checked in the answer TEXT unless `text: false`,
#           the others only in the tool output unless `text: true`. All must be in the tool output.
#   text_mode: all (default) | any  - how text-checked items combine
#   rls: true  - counted in the row-level-security pass rate

# ------------------------------------------------------------------------------- P&L
- id: pnl_us_op
  category: pnl
  q: How is operating profit YTD vs last year and budget for the United States?
  tools: [get_pnl]
  expect:
    - {m: maop, org: {l3_country: United States}, p: YTD-2026-10}
    - {m: maop, org: {l3_country: United States}, p: YTD-2026-10, v: PY}
    - {m: maop, org: {l3_country: United States}, p: YTD-2026-10, v: Budget}
- id: pnl_mx_net_income
  category: pnl
  q: What is the net income of Mexico this year?
  tools: [get_pnl, get_trend]
  expect:
    - {m: net_income, org: {l3_country: Mexico}, p: YTD-2026-10}
- id: pnl_ca_q3
  category: pnl
  q: Show me the P&L of Canada for Q3 2025
  tools: [get_pnl]
  expect:
    - {m: maop, org: {l3_country: Canada}, p: Q-2025-3}
    - {m: production, org: {l3_country: Canada}, p: Q-2025-3}
- id: pnl_bpu_fy2025
  category: pnl
  q: How did BPU perform in FY 2025?
  tools: [get_pnl]
  expect:
    - {m: maop, org: {l2_region: BPU}, p: FY-2025}
    - {m: production, org: {l2_region: BPU}, p: FY-2025}
- id: pnl_br_production_last_month
  category: pnl
  q: What was production in Brazil last month?
  tools: [get_pnl, get_trend]
  expect:
    - {m: production, org: {l3_country: Brazil}, p: M-2026-10}
- id: pnl_cl_industry_gp
  category: pnl
  q: Gross profit for Industry & Energy in Chile YTD vs budget
  tools: [get_pnl, variance_drivers, compare_versions]
  expect:
    - {m: gross_profit, org: {l3_country: Chile, l4_product_line: Industry & Energy}, p: YTD-2026-10}
    - {m: gross_profit, org: {l3_country: Chile, l4_product_line: Industry & Energy}, p: YTD-2026-10, v: Budget}
- id: pnl_group_ytd
  category: pnl
  q: How is the whole group doing this year?
  tools: [get_pnl]
  expect:
    - {m: maop, p: YTD-2026-10}
    - {m: production, p: YTD-2026-10}
- id: pnl_consumer_2025
  category: pnl
  q: Revenue and operating profit for Consumer Products in 2025
  tools: [get_pnl]
  text_mode: any
  expect:
    - {m: maop, org: {l4_product_line: Consumer Products}, p: FY-2025}
    - {m: revenue, org: {l4_product_line: Consumer Products}, p: FY-2025, text: true}
- id: pnl_ssa_ebit
  category: pnl
  q: EBIT of Southern South America year to date
  tools: [get_pnl, get_trend]
  expect:
    - {m: management_op, org: {l2_region: Southern South America}, p: YTD-2026-10}
- id: pnl_co_vs_budget
  category: pnl
